name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Ensure splash resources exist
        run: |
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/splashscreen_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <color name="splashscreen_background">#123047</color>
          </resources>
          EOF

      - name: Disable Jetifier for React Native 0.74 Hermes
        run: |
          if [ -f android/gradle.properties ]; then
            sed -i '/^android.enableJetifier=/d' android/gradle.properties
            printf '\nandroid.enableJetifier=false\n' >> android/gradle.properties
          fi

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Camion-dz-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
